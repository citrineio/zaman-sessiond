# CM2 bring-up profile. No Q6A output names, kernel settings or fixed display modes.
set $mod Mod4
output * bg #111416 solid_color
workspace library
bindsym $mod+Return exec foot
bindsym F12 exec /usr/bin/zaman-menu toggle
bindsym $mod+Shift+e exit
for_window [app_id="org.pegasus-frontend.pegasus-fe"] move to workspace library, fullscreen enable
exec /usr/bin/zaman-session-enter
